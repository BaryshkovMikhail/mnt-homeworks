version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: jira-postgres
    environment:
      POSTGRES_DB: jiradb
      POSTGRES_USER: jirauser
      POSTGRES_PASSWORD: jirapassword
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - jira-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jirauser -d jiradb"]
      interval: 30s
      timeout: 10s
      retries: 5

  jira:
    image: atlassian/jira-software:latest
    container_name: jira-software
    environment:
      - ATL_JDBC_URL=jdbc:postgresql://postgres:5432/jiradb
      - ATL_JDBC_USER=jirauser
      - ATL_JDBC_PASSWORD=jirapassword
      - ATL_DB_DRIVER=org.postgresql.Driver
    ports:
      - "8080:8080"
    volumes:
      - jiraVolume:/var/atlassian/application-data/jira
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jira-network

volumes:
  jiraVolume:
  postgres_data:

networks:
  jira-network:
    driver: bridge