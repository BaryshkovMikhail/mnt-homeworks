filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - drop_event.when:
          not.equals:
            container.name: "some_app"

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5046"]
  protocol: tcp

logging.json: true
logging.metrics.enabled: false