input {
  beats {
    port => 5046
  }
}

filter {
  json {
    source => "message"
    # target не обязателен — можно распарсить прямо в корень
  }
  # Если нужно, можно удалить исходное поле:
  # mutate { remove_field => ["message"] }
}

output {
  stdout { codec => rubydebug }
  elasticsearch {
    hosts => ["es-hot:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
}