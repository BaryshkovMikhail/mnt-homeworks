---
- name: Install Clickhouse on Ubuntu
  hosts: clickhouse
  become: true
  vars_files:
    - group_vars/clickhouse/vars.yml

  tasks:
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - dirmngr
          - gnupg
        state: present
        update_cache: yes

    - name: Add Clickhouse GPG key via keyserver
      ansible.builtin.apt_key:
        keyserver: hkp://keyserver.ubuntu.com:80
        id: 8919F6BD2B48D754
        state: present

    - name: Add Clickhouse APT repository
      ansible.builtin.apt_repository:
        repo: "deb https://packages.clickhouse.com/deb stable main"
        state: present
        filename: clickhouse

    - name: Update package list
      apt:
        update_cache: yes

    - name: Install Clickhouse packages
      apt:
        name:
          - clickhouse-server
          - clickhouse-client
        state: present

    - name: Ensure Clickhouse service is enabled and running
      systemd:
        name: clickhouse-server
        state: started
        enabled: yes

    - name: Create database logs
      command: clickhouse-client -q 'CREATE DATABASE IF NOT EXISTS logs;'
      register: create_db
      changed_when: create_db.rc == 0
      retries: 5
      delay: 3
      until: create_db is succeeded

  tags:
    - clickhouse

# ===================================================================
# Play: Установка Lighthouse через Nginx (для Ubuntu)
# ===================================================================

- name: Install and configure Lighthouse
  hosts: lighthouse
  become: true
  vars:
    lighthouse_repo: https://github.com/VKCOM/lighthouse.git
    lighthouse_path: /var/www/lighthouse
    nginx_vhost: /etc/nginx/sites-available/lighthouse
    nginx_link: /etc/nginx/sites-enabled/lighthouse

  handlers:
    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure web root directory exists
      file:
        path: "{{ lighthouse_path }}"
        state: directory
        recurse: yes

    - name: Clone Lighthouse repository
      git:
        repo: "{{ lighthouse_repo }}"
        dest: "{{ lighthouse_path }}"
        version: HEAD
        clone: yes
        update: yes

    - name: Template Nginx config for Lighthouse
      template:
        src: templates/lighthouse.conf.j2
        dest: "{{ nginx_vhost }}"
      notify: Reload Nginx

    - name: Enable Lighthouse site in Nginx
      file:
        src: "{{ nginx_vhost }}"
        dest: "{{ nginx_link }}"
        state: link
      notify: Reload Nginx

    - name: Disable default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Ensure Nginx is started and enabled
      systemd:
        name: nginx
        state: started
        enabled: yes

  tags:
    - lighthouse